name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    name: Windows / Python 3.12 / Node 24
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Python unit tests
        shell: pwsh
        run: |
          $env:PYTHONPATH = Join-Path $PWD 'native'
          python -m unittest discover -s tests -p "test_*.py" -v

      - name: Node built-in tests
        shell: pwsh
        run: node --test tests/background.test.mjs tests/buddy.test.mjs tests/quota-ring.test.mjs tests/usage-chart.test.mjs
